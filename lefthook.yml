pre-commit:
  parallel: false
  commands:
    frontend-biome:
      glob: "frontend/**/*.{js,ts,jsx,tsx,json}"
      run: bunx biome check --files-ignore-unknown=true --no-errors-on-unmatched {staged_files}
    frontend-typecheck:
      glob: "frontend/**/*.{ts,tsx}"
      run: bun run --cwd frontend tsc --noEmit
    backend-ruff-format:
      glob: "backend/**/*.py"
      run: uv run --project backend ruff format --check {staged_files}
    backend-ruff-check:
      glob: "backend/**/*.py"
      run: uv run --project backend ruff check {staged_files}
    backend-typecheck:
      glob: "backend/**/*.py"
      run: uv run --project backend mypy backend/
    backend-test:
      glob: "backend/**/*.py"
      run: uv run --project backend pytest backend/
